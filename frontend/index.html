<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Mission Copilot</title>
</head>
<body>
<p><strong>AI-powered mission control system that analyzes spacecraft telemetry and generates decisions in real time.</strong></p>
    <h1>AI Mission Decision Copilot</h1>

    <!-- SCENARIOS -->
    <h3>Select Scenario:</h3>

    <button onclick="setScenario('thermal')">Thermal Anomaly</button>
    <button onclick="setScenario('energy')">Energy Anomaly</button>
    <button onclick="setScenario('communication')">Communication Loss</button>
<p><strong>Selected Scenario:</strong> <span id="selectedScenario">None</span></p>
    <br><br>

    <!-- ANALYZE BUTTON -->
    <button id="analyzeBtn" onclick="analyze()">Analyze</button>

    <hr>

    <!-- RESULT -->
    <h2>Result</h2>
    <hr>
    <h2>AI Decision Output</h2></hr>
    <p><strong>Classification:</strong> <span id="classification">-</span></p>
    <p><strong>Severity:</strong> <span id="severity" style="font-weight:bold;">-</span></p>
    <p><strong>Recommended Action:</strong> <span id="action">-</span></p>
    <p><strong>Reasoning:</strong> <span id="reasoning">-</span></p>

    <script>
        let selectedScenario = null;

        function setScenario(type) {
            if (type === 'thermal') {
                selectedScenario = {
                    "subsystem": "thermal",
                    "metric": "temperature_core",
                    "value": 85,
                    "mission_phase": "nominal",
                    "timestamp": "2026-04-17T12:30:00Z"
                };
            }
            if (type === 'energy') {
                selectedScenario = {
                    "subsystem": "power",
                    "metric": "battery_voltage",
                    "value": 21,
                    "mission_phase": "nominal",
                    "timestamp": "2026-04-17T12:32:00Z"
                };
            }
            
            if (type === 'communication') {
                selectedScenario = {
                    "subsystem": "communications",
                    "metric": "packet_loss",
                    "value": 35,
                    "mission_phase": "nominal",
                    "timestamp": "2026-04-17T12:35:00Z"
                };
            }
            
            document.getElementById("selectedScenario").innerText = type;
        }
        
       async function analyze() {
        if (!selectedScenario) {
            alert("Please select a scenario first.");
            return;
        }
        
        const btn = document.getElementById("analyzeBtn");

        //  LOCK BUTTON
        btn.disabled = true;
        btn.innerText = "Analyzing...";

        //  ADD THIS HERE
        document.getElementById("classification").innerText = "Analyzing...";
        document.getElementById("severity").innerText = "-";
        document.getElementById("action").innerText = "-";
        document.getElementById("reasoning").innerText = "Processing telemetry...";
        try {
            const response = await fetch("/analyze", {
                     method: "POST",

                     headers: {
                        "Content-Type": "application/json"
                     },
                      body: JSON.stringify(selectedScenario)
                    });

                    console.log("STATUS:", response.status);
                    const data = await response.json(); 
                    console.log("DATA:", data);

                // MAP JSON → UI
                document.getElementById("classification").innerText = data.classification || "N/A";
                document.getElementById("severity").innerText = data.severity || "N/A";
                document.getElementById("action").innerText = data.recommended_action || "N/A";
                document.getElementById("reasoning").innerText = data.reasoning || "N/A";
                
                
                // UNLOCK
                btn.disabled = false;


            } catch (error) {
                document.getElementById("classification").innerText = "Error";
                 document.getElementById("severity").innerText = "-";
                 document.getElementById("action").innerText = "-";
                 document.getElementById("reasoning").innerText = "Error analyzing telemetry";
                 
                 console.error(error);
                }
                
                //  UNLOCK HERE TOO
                btn.disabled = false;
        }
    </script>

</body>
</html>
